<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunch Plan</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'EB Garamond', Georgia, serif;
  background: #0d0a06;
  color: #D4A520;
  padding: 24px 18px 56px;
  max-width: 780px;
  margin: 0 auto;
  min-height: 100vh;
}
.header { margin-bottom: 26px; border-bottom: 1px solid #3d2a0e; padding-bottom: 16px; }
.header h1 {
  font-family: 'Cinzel', serif;
  font-size: 22px; font-weight: 700;
  color: #8c6a1b;
  margin-bottom: 5px; letter-spacing: 0.05em;
  text-transform: uppercase;
}
.header p { font-size: 13px; color: #7a5e30; font-style: italic; }

.featured-card {
  background: #1a0f05;
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 14px;
  border: 1px solid #5C3D1E;
  cursor: pointer;
  transition: border-color 0.15s;
}
.featured-card:hover { border-color: #8B6018; }
.featured-header {
  background: #5c1010;
  border-bottom: 2px solid #8B1515;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.featured-day-name {
  font-family: 'Cinzel', serif;
  font-size: 20px; font-weight: 700;
  color: #E8C060; letter-spacing: 0.08em;
  text-transform: uppercase;
}
.featured-day-date { font-size: 13px; color: rgba(212,165,32,0.55); margin-top: 3px; font-style: italic; }
.f-badge {
  font-family: 'Cinzel', serif;
  font-size: 10px; font-weight: 600;
  background: rgba(138, 130, 111, 0.15);
  color: #E8C060;
  border: 1px solid #8B6018;
  padding: 4px 11px;
  border-radius: 2px;
  white-space: nowrap; margin-top: 3px;
  letter-spacing: 0.08em; text-transform: uppercase;
}
.featured-body { padding: 18px 22px 16px; }
.featured-meal-name {
  font-family: 'Cinzel', serif;
  font-size: 17px; font-weight: 600;
  color: #E8C060; margin-bottom: 4px; letter-spacing: 0.03em;
}
.featured-meal-note { font-size: 13px; color: #9d6d48; margin-bottom: 14px; font-style: italic; }
.toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #B8860B; font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.t-icon { width: 22px; height: 22px; border-radius: 2px; background: rgba(184,134,11,0.12); border: 1px solid #5C3D1E; display: flex; align-items: center; justify-content: center; transition: background 0.15s; flex-shrink: 0; }
.t-icon svg { width: 10px; height: 10px; stroke: #B8860B; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s ease; }
.open .t-icon { background: #5c1010; border-color: #8B1515; }
.open .t-icon svg { stroke: #E8C060; transform: rotate(180deg); }
.open .toggle-row span { color: #5C3D1E; }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(225px, 1fr)); gap: 10px; }
.day-card {
  background: #221308;
  border-radius: 4px; overflow: hidden;
  border: 1px solid #785c2f;
  cursor: pointer; transition: border-color 0.15s;
}
.day-card:hover { border-color: #b8a07a; }
.day-card-head { background: #621313; border-bottom: 1px solid #785c2f; padding: 12px 15px; }
.day-card-name { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 700; color: #E8C060; letter-spacing: 0.07em; text-transform: uppercase; }
.day-card-date { font-size: 11px; color: #8B6040; margin-top: 2px; font-style: italic; }
.d-badge { display: inline-block; font-family: 'Cinzel', serif; font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; background: #5c1010; color: #E8C060; border: 1px solid #826a31; padding: 2px 7px; border-radius: 2px; margin-top: 5px; }
.day-body { padding: 13px 15px 13px; }
.day-meal-name { font-family: 'Cinzel', serif; font-size: 13px; font-weight: 600; color: #ac8939; margin-bottom: 3px; line-height: 1.4; }
.day-meal-note { font-size: 11px; color: #9d6d48; margin-bottom: 12px; font-style: italic; }
.d-toggle-row { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #B8860B; font-family: 'Cinzel', serif; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.dt-icon { width: 20px; height: 20px; border-radius: 2px; background: rgba(92,16,16,0.08); border: 1px solid #5C3D1E; display: flex; align-items: center; justify-content: center; transition: background 0.15s; flex-shrink: 0; }
.dt-icon svg { width: 9px; height: 9px; stroke: #B8860B; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s ease; }
.open .dt-icon { background: #5c1010; border-color: #8B1515; }
.open .dt-icon svg { stroke: #E8C060; transform: rotate(180deg); }
.open .d-toggle-row span { color: #b8a07a; }

.recipe-drawer { max-height: 0; overflow: hidden; transition: max-height 0.32s ease; }
.open .recipe-drawer { max-height: 800px; }
.recipe-inner { border-top: 1px solid #2a1a08; padding: 16px 22px 20px; }
.day-card .recipe-inner { border-top: 1px solid #785c2f; padding: 13px 15px 16px; }
.rsec { margin-bottom: 16px; }
.rsec:last-child { margin-bottom: 0; }
.rsec-label {
  font-family: 'Cinzel', serif;
  font-size: 9px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: #8B6040; margin-bottom: 9px;
}
.ing-list { list-style: none; }
.ing-list li { font-size: 14px; color: #A07828; padding: 3px 0 3px 15px; position: relative; line-height: 1.5; }
.day-card .ing-list li { color: #A07828; }
.ing-list li::before { content: ''; position: absolute; left: 0; top: 10px; width: 5px; height: 1px; background: #5C3D1E; }
.day-card .ing-list li::before { background: #c4a882; }
.steps-list { list-style: none; counter-reset: step; }
.steps-list li {
  font-size: 14px; color: #A07828; line-height: 1.6;
  padding: 7px 0 7px 32px; position: relative;
  counter-increment: step;
  border-bottom: 1px solid #1e1208;
}
.day-card .steps-list li { color: #A07828; border-bottom: 1px solid #785c2f; }
.steps-list li:last-child { border-bottom: none; padding-bottom: 0; }
.day-card .steps-list li:last-child { border-bottom: none; }
.steps-list li::before {
  content: counter(step);
  position: absolute; left: 0; top: 8px;
  width: 20px; height: 20px; border-radius: 2px;
  background: #5c1010; color: #E8C060;
  font-family: 'Cinzel', serif;
  font-size: 10px; font-weight: 700;
  text-align: center; line-height: 20px;
  border: 1px solid #8B1515;
}
.footer { margin-top: 20px; text-align: center; font-size: 12px; color: #3d2a0e; font-style: italic; border-top: 1px solid #1e1208; padding-top: 14px; }
</style>
</head>
<body>

<div class="header">
  <h1>Lunch This Week</h1>
  <p id="sub">May 4 – 7 &nbsp;·&nbsp; Tap to see the recipe</p>
</div>

<div id="root"></div>
<div class="footer">Obrigada! Love you, Ventu ♡ </div>

<script>
var DAYS = [
  {
    key: 4, label: 'Monday', date: 'May 4',
    name: 'Orange Chicken',
    note: 'With rice · oven',
    ing: [
      '1 pechuga de pollo',
      'Jugo de 1 naranja',
      '6 cdas de coconut aminos',
      '3/4 cdta de ajo en polvo',
      'Pimienta al gusto',
      'Hojuelas de chile (opcional)',
      'Arroz cocido'
    ],
    steps: [
      'Mezcla el jugo de naranja con los coconut aminos, ajo en polvo, pimienta y hojuelas de chile. Esa es la marinada.',
      'Marina la pechuga por lo menos 15 minutos (o toda la noche en la refri para más sabor).',
      'Precalienta el horno a 200°C (400°F).',
      'Coloca el pollo en un molde y vierte la marinada encima. Cubre con papel aluminio los primeros 15 minutos.',
      'Destapa y hornea 8–10 minutos más hasta dorar. Opcional: gratina 2–3 minutos al final.',
      'Sirve sobre arroz bañado con la salsa del molde.'
    ]
  },
  {
    key: 5, label: 'Tuesday', date: 'May 5',
    name: 'Crispy Chicken with Mushrooms & Potatoes',
    note: 'Oat-crusted · air fryer',
    ing: [
      '1 pechuga de pollo',
      '1 huevo batido',
      'Avena (para empanizar)',
      'Ajo en polvo, sal y pimienta',
      'Champiñones',
      '3/4 taza de papas en trozos',
      'Romero',
      'Aceite de oliva en spray'
    ],
    steps: [
      'Mezcla el huevo con la avena, sal, pimienta y ajo en polvo en un plato.',
      'Pasa la pechuga por la mezcla y cúbrela bien.',
      'Cocina en freidora de aire a 190°C (375°F) por 12–15 minutos, voltea a la mitad. La temperatura interna debe llegar a 74°C.',
      'Aparte, coloca los champiñones y las papas con aceite en spray, romero y ajo en polvo. Cocina a 190°C por 15 minutos.',
      'Aderezo de yogurt opcional: 2 cdas de yogurt, limón, ajo en polvo, mostaza, sal y pimienta.'
    ]
  },
  {
    key: 6, label: 'Wednesday', date: 'May 6',
    name: 'Instant Pot Stew',
    note: 'Flank steak + potatoes · 30 min pressure',
    ing: [
      'Bistec de falda en cubos grandes',
      '1 cebolla en rodajas gruesas',
      '1 tomate pelado y picado en cubitos (sin semillas)',
      'Papas en trozos',
      'Pimentón en polvo, sal y pimienta',
      '2 tazas de agua'
    ],
    steps: [
      'Corta la carne en cubos grandes y sazónala con pimentón, sal y pimienta.',
      'En el Instant Pot: primera capa de cebolla en rodajas, luego el tomate picado, después la carne y al final las papas.',
      'Agrega 2 tazas de agua. No revuelvas.',
      'Cierra la tapa y cocina en alta presión por 30 minutos.',
      'Deja liberar la presión naturalmente al terminar.'
    ]
  },
  {
    key: 7, label: 'Thursday', date: 'May 7',
    name: 'Steak and Veggies',
    note: 'Lomo saltado style · air fryer',
    ing: [
      '180g de bistec de falda',
      '1 cebolla en rodajas',
      '1 tomate',
      'Ajo en polvo',
      'Coconut aminos o salsa de soya'
    ],
    steps: [
      'Corta el bistec en tiras y sazónalo con ajo en polvo y coconut aminos. Marina por lo menos 15 minutos.',
      'Cocina en freidora de aire a 200°C (400°F) por 6–8 minutos, agitando a la mitad.',
      'Agrega la cebolla en rodajas y el tomate. Cocina a 190°C (380°F) por 3–4 minutos más.',
      'Mezcla todo y sirve de inmediato.'
    ]
  }
];

function toggle(el) { el.classList.toggle('open'); }

function makeRecipe(d) {
  var ingHTML = d.ing.map(function(i){ return '<li>' + i + '</li>'; }).join('');
  var stepsHTML = d.steps.map(function(s){ return '<li>' + s + '</li>'; }).join('');
  return '<div class="recipe-drawer"><div class="recipe-inner"><div class="rsec"><div class="rsec-label">Ingredients</div><ul class="ing-list">' + ingHTML + '</ul></div><div class="rsec"><div class="rsec-label">Preparation</div><ol class="steps-list">' + stepsHTML + '</ol></div></div></div>';
}

function render() {
  var now = new Date();
  var todayN = now.getMonth() === 4 ? now.getDate() : -1;
  var tmrwN = todayN + 1;

  var featured = DAYS.filter(function(d){ return d.key === todayN; })[0]
    || DAYS.filter(function(d){ return d.key === tmrwN; })[0]
    || DAYS[0];
  var rest = DAYS.filter(function(d){ return d.key !== featured.key; });

  function statusOf(key) {
    if (key === todayN) return 'Today';
    if (key === tmrwN) return 'Tomorrow';
    return null;
  }

  var sl = statusOf(featured.key);
  var badge = sl ? '<span class="f-badge">' + sl + '</span>' : '';
  var chevronSVG = '<svg viewBox="0 0 10 6"><polyline points="1,1 5,5 9,1"/></svg>';

  var featuredHTML = '<div class="featured-card" onclick="toggle(this)">'
    + '<div class="featured-header"><div><div class="featured-day-name">' + featured.label + '</div><div class="featured-day-date">' + featured.date + '</div></div>' + badge + '</div>'
    + '<div class="featured-body"><div class="featured-meal-name">' + featured.name + '</div><div class="featured-meal-note">' + featured.note + '</div>'
    + '<div class="toggle-row"><div class="t-icon">' + chevronSVG + '</div><span>See Recipe</span></div></div>'
    + makeRecipe(featured) + '</div>';

  var restHTML = '<div class="grid">' + rest.map(function(d) {
    var s = statusOf(d.key);
    var dbadge = s ? '<div class="d-badge">' + s + '</div>' : '';
    return '<div class="day-card" onclick="toggle(this)">'
      + '<div class="day-card-head"><div class="day-card-name">' + d.label + '</div><div class="day-card-date">' + d.date + '</div>' + dbadge + '</div>'
      + '<div class="day-body"><div class="day-meal-name">' + d.name + '</div><div class="day-meal-note">' + d.note + '</div>'
      + '<div class="d-toggle-row"><div class="dt-icon">' + chevronSVG + '</div><span>See Recipe</span></div></div>'
      + makeRecipe(d) + '</div>';
  }).join('') + '</div>';

  document.getElementById('root').innerHTML = featuredHTML + restHTML;

  var sub = document.getElementById('sub');
  if (todayN >= 4 && todayN <= 7) sub.textContent = 'Today highlighted above · tap to see the recipe';
  else if (tmrwN >= 4 && tmrwN <= 7) sub.textContent = 'Starts tomorrow · tap to see the recipe';
}

render();
</script>
</body>
</html>
